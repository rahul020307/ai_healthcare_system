[project]
name = "curaassist-carehub-backend"
version = "0.1.0"
description = "CuraAssist CareHub backend"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.1.0",
]

[tool.fastapi]
entrypoint = "app.main:app"
