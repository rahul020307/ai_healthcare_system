<!DOCTYPE html>
<html lang="en" class="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CuraAssist CareHub — Registration</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="styles.css"></head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
<main class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(circle_at_top_left,rgba(20,184,166,0.18),transparent_35%),radial-gradient(circle_at_bottom_right,rgba(6,182,212,0.15),transparent_35%)]">
<section class="w-full max-w-lg"><div class="glass-panel border border-teal-500/40 rounded-3xl p-6 sm:p-8 space-y-6 shadow-2xl">
<div class="text-center space-y-3"><div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-teal-500 via-cyan-500 to-indigo-500 flex items-center justify-center mx-auto shadow-xl ring-8 ring-teal-500/20"><i data-lucide="shield-check" class="w-8 h-8 text-slate-950"></i></div>
<span class="inline-flex text-[10px] font-extrabold text-teal-400 tracking-widest uppercase bg-teal-500/10 px-3 py-1 rounded-full border border-teal-500/20">🔒 CuraAssist AI Healthcare Gateway</span>
<h1 class="text-3xl font-extrabold text-white">Create Account</h1><p class="text-sm text-slate-300">Create your personal CuraAssist healthcare account.</p></div>
<button onclick="loginWithGitHub()" class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-white font-semibold">🐙 Continue with GitHub (OAuth)</button>
<div id="msg" class="hidden text-xs py-2.5 px-3 rounded-xl border text-center font-semibold"></div>
<form onsubmit="event.preventDefault();handleRegister()" class="space-y-4">
<input id="name" required class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white" placeholder="Full name" autocomplete="name">
<input id="email" type="email" required class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white" placeholder="Email address" autocomplete="email">
<input id="phone" type="tel" class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white" placeholder="Mobile number">
<div class="grid grid-cols-3 gap-2"><input id="age" type="number" min="1" max="120" value="30" class="glass-input rounded-xl px-3 py-3 text-sm text-white" placeholder="Age"><select id="blood" class="glass-input rounded-xl px-2 py-3 text-sm text-slate-200"><option>O+</option><option>A+</option><option>B+</option><option>AB+</option><option>O-</option><option>A-</option><option>B-</option><option>AB-</option></select><input id="city" value="Hyderabad" class="glass-input rounded-xl px-3 py-3 text-sm text-white" placeholder="City"></div>
<input id="password" type="password" required minlength="6" class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white" placeholder="Create password" autocomplete="new-password">
<button id="register-btn" class="w-full bg-gradient-to-r from-teal-500 via-cyan-500 to-teal-400 text-slate-950 font-black py-3 rounded-xl">Register & Launch Care Workspace</button></form><p class="text-center text-[11px] text-slate-500 mt-3">Already have an account? <a href="login.html" class="text-teal-400 hover:text-teal-300 font-bold">Sign in</a></p></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
window.SUPABASE_URL="https://ifwsijbkmuzqttwbvifp.supabase.co";window.SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlmd3NpamJrbXV6cXR0d2J2aWZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MjM2MTIsImV4cCI6MjEwMzE5OTYxMn0.4DConv73Vs47OIxvatkX8RvfufT1G-1GBm6JTHo7Q04";
const client=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
function msg(t,type){const e=document.getElementById('msg');e.className='text-xs py-2.5 px-3 rounded-xl border text-center font-semibold '+(type==='error'?'bg-rose-500/10 border-rose-500/30 text-rose-300':'bg-teal-500/10 border-teal-500/30 text-teal-300');e.textContent=t;e.classList.remove('hidden');}
async function handleRegister(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),age=document.getElementById('age').value,blood=document.getElementById('blood').value,city=document.getElementById('city').value.trim(),b=document.getElementById('register-btn');b.disabled=true;msg('⏳ Creating your account…','loading');try{const{data,error}=await client.auth.signUp({email,password,options:{data:{name,phone,age,blood,city},emailRedirectTo:new URL('login.html',location.href).toString()}});if(error)throw error;if(!data.session?.access_token){msg('✅ Account created. Check your email to confirm, then sign in.','loading');return}localStorage.setItem('cura_active_user_v1',JSON.stringify({isLoggedIn:true,userName:name||email.split('@')[0],email,phone,age,blood,city,token:data.session.access_token}));window.location.replace('home.html');}catch(e){msg(e.message||'Registration failed.','error')}finally{b.disabled=false}}
async function handleLogin(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,b=document.getElementById('login-btn');b.disabled=true;msg('⏳ Signing in…','loading');try{const{data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;if(!data.session?.access_token)throw new Error('No active session returned.');localStorage.setItem('cura_active_user_v1',JSON.stringify({isLoggedIn:true,userName:data.user?.user_metadata?.name||email.split('@')[0],email:data.user?.email||email,token:data.session.access_token}));window.location.replace('home.html');}catch(e){msg(e.message||'Sign in failed.','error');}finally{b.disabled=false}}
async function loginWithGitHub(){const{error}=await client.auth.signInWithOAuth({provider:'github',options:{redirectTo:new URL('home.html',location.href).toString()}});if(error)msg(error.message||'GitHub sign in failed.','error')}
lucide.createIcons();
</script></body></html>
