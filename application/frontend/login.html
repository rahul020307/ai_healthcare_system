<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CuraAssist CareHub — Sign In</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{teal:{400:'#2dd4bf',500:'#14b8a6'},cyan:{400:'#22d3ee',500:'#06b6d4'}}}}};</script>
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
<main class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(circle_at_top_left,rgba(20,184,166,0.18),transparent_35%),radial-gradient(circle_at_bottom_right,rgba(6,182,212,0.15),transparent_35%)]">
<section class="w-full max-w-lg">
<div class="glass-panel border border-teal-500/40 rounded-3xl p-6 sm:p-8 space-y-6 shadow-2xl">
<div class="text-center space-y-3">
<div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-teal-500 via-cyan-500 to-indigo-500 flex items-center justify-center mx-auto shadow-xl ring-8 ring-teal-500/20"><i data-lucide="shield-check" class="w-8 h-8 text-slate-950"></i></div>
<span class="inline-flex text-[10px] font-extrabold text-teal-400 tracking-widest uppercase bg-teal-500/10 px-3 py-1 rounded-full border border-teal-500/20">🔒 CuraAssist AI Healthcare Gateway</span>
<h1 class="text-3xl font-extrabold text-white">Sign In</h1><p class="text-sm text-slate-300">Access your personal AI healthcare workspace.</p>
</div>
<div class="flex bg-slate-900/90 p-1.5 rounded-2xl text-xs font-bold border border-slate-800">
<button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2.5 rounded-xl bg-teal-500 text-slate-950 shadow-md">🔑 Sign In</button>
<button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2.5 rounded-xl text-slate-400">✨ Register</button></div>
<button onclick="loginWithGitHub()" class="w-full py-3 rounded-xl bg-slate-900 border border-slate-700 text-white font-semibold text-sm">🐙 Continue with GitHub (OAuth)</button>
<div id="auth-message" class="hidden text-xs py-2.5 px-3.5 rounded-xl border text-center font-semibold"></div>
<form id="login-form" class="space-y-4" onsubmit="event.preventDefault();handleAuth('login')">
<input id="login-email" type="email" required autocomplete="email" class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white" placeholder="Email address">
<input id="login-password" type="password" required autocomplete="current-password" class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white" placeholder="Password">
<button id="login-submit" class="w-full bg-gradient-to-r from-cyan-500 to-teal-500 text-slate-950 font-black py-3 rounded-xl">Sign In to Healthcare Portal</button></form>
<form id="register-form" class="hidden space-y-4" onsubmit="event.preventDefault();handleAuth('register')">
<input id="reg-name" required class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white" placeholder="Full name">
<input id="reg-email" type="email" required class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white" placeholder="Email address">
<input id="reg-phone" type="tel" class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white" placeholder="Mobile number">
<div class="grid grid-cols-3 gap-2"><input id="reg-age" type="number" min="1" max="120" value="30" class="glass-input rounded-xl px-3 py-3 text-sm text-white" placeholder="Age"><select id="reg-blood" class="glass-input rounded-xl px-2 py-3 text-sm text-slate-200"><option>O+</option><option>A+</option><option>B+</option><option>AB+</option><option>O-</option><option>A-</option><option>B-</option><option>AB-</option></select><input id="reg-city" value="Hyderabad" class="glass-input rounded-xl px-3 py-3 text-sm text-white" placeholder="City"></div>
<input id="reg-password" type="password" required minlength="6" class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white" placeholder="Create password">
<button id="register-submit" class="w-full bg-gradient-to-r from-teal-500 via-cyan-500 to-teal-400 text-slate-950 font-black py-3 rounded-xl">Register & Launch Care Workspace</button></form>
<p class="text-[11px] text-slate-500 text-center">Authentication is handled by Supabase. Successful sign-in returns you to CuraAssist.</p>
</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.SUPABASE_URL="https://ifwsijbkmuzqttwbvifp.supabase.co";
window.SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlmd3NpamJrbXV6cXR0d2J2aWZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MjM2MTIsImV4cCI6MjEwMzE5OTYxMn0.4DConv73Vs47OIxvatkX8RvfufT1G-1GBm6JTHo7Q04";
const client=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
function switchAuthTab(m){document.getElementById('login-form').classList.toggle('hidden',m!=='login');document.getElementById('register-form').classList.toggle('hidden',m!=='register');document.getElementById('tab-login').className=m==='login'?'flex-1 py-2.5 rounded-xl bg-teal-500 text-slate-950 shadow-md':'flex-1 py-2.5 rounded-xl text-slate-400';document.getElementById('tab-register').className=m==='register'?'flex-1 py-2.5 rounded-xl bg-teal-500 text-slate-950 shadow-md':'flex-1 py-2.5 rounded-xl text-slate-400';}
function showMessage(t,type='error'){const e=document.getElementById('auth-message');if(!t){e.classList.add('hidden');return}e.classList.remove('hidden');e.textContent=t;e.className='text-xs py-2.5 px-3.5 rounded-xl border text-center font-semibold '+(type==='success'?'bg-emerald-500/10 border-emerald-500/30 text-emerald-300':type==='loading'?'bg-teal-500/10 border-teal-500/30 text-teal-300':'bg-rose-500/10 border-rose-500/30 text-rose-300');}
async function handleAuth(mode){const email=document.getElementById(mode==='login'?'login-email':'reg-email').value.trim(),password=document.getElementById(mode==='login'?'login-password':'reg-password').value,btn=document.getElementById(mode==='login'?'login-submit':'register-submit');btn.disabled=true;showMessage('⏳ Authenticating with CuraAssist…','loading');try{let data,error;if(mode==='register'){const name=document.getElementById('reg-name').value.trim(),phone=document.getElementById('reg-phone').value.trim(),age=document.getElementById('reg-age').value,blood=document.getElementById('reg-blood').value,city=document.getElementById('reg-city').value.trim();({data,error}=await client.auth.signUp({email,password,options:{data:{name,phone,age,blood,city},emailRedirectTo:new URL('index.html',location.href).toString()}}));}else({data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;if(!data?.session?.access_token){showMessage('No active session was returned.','error');return}localStorage.setItem('cura_active_user_v1',JSON.stringify({isLoggedIn:true,userName:data.session.user?.user_metadata?.name||email.split('@')[0],email:data.session.user?.email||email,token:data.session.access_token}));location.replace('index.html');}catch(e){showMessage(e?.message||'Authentication failed. Please try again.','error')}finally{btn.disabled=false}}
async function loginWithGitHub(){const{error}=await client.auth.signInWithOAuth({provider:'github',options:{redirectTo:new URL('index.html',location.href).toString()}});if(error)showMessage(error.message,'error')}
lucide.createIcons();switchAuthTab('login');
</script></body></html>
