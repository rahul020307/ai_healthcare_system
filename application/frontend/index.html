<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuraAssist CareHub - Smart AI Healthcare & Medical Assistant Platform</title>

  <!-- Primary Meta Tags & Search Engine Optimization (SEO) -->
  <meta name="title" content="CuraAssist CareHub - Smart AI Healthcare & Medical Assistant Platform">
  <meta name="description" content="CuraAssist CareHub is an advanced AI-powered healthcare system featuring 24/7 Google Gemini AI clinical chatbot, smart medicine photo & barcode scanner, OCR prescription reader, doctor appointments, and health tracking.">
  <meta name="keywords" content="CuraAssist CareHub, CuraAssist, CareHub, AI Healthcare System, CuraBot AI, Online Doctor Appointment, Medicine Scanner, Prescription OCR, Health Tracker">
  <meta name="author" content="CuraAssist CareHub Team">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta name="googlebot" content="index, follow">
  <link rel="canonical" href="https://ai-healthcare-system-eta.vercel.app/">

  <!-- Open Graph / Facebook / WhatsApp SEO -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ai-healthcare-system-eta.vercel.app/">
  <meta property="og:title" content="CuraAssist CareHub - Smart AI Healthcare Platform">
  <meta property="og:description" content="Access 24/7 Google Gemini AI medical guidance, medicine photo scanning, prescription translation, and doctor appointment scheduling with CuraAssist CareHub.">
  <meta property="og:site_name" content="CuraAssist CareHub">

  <!-- Twitter SEO Card -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://ai-healthcare-system-eta.vercel.app/">
  <meta property="twitter:title" content="CuraAssist CareHub - Smart AI Healthcare Platform">
  <meta property="twitter:description" content="CuraAssist CareHub provides 24/7 Gemini AI medical guidance, prescription scanning, and healthcare tracking.">

  <!-- Structured Data JSON-LD for Google Search Crawlers -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MedicalWebPage",
    "name": "CuraAssist CareHub",
    "alternateName": ["CuraAssist", "CareHub", "CuraAssist CareHub AI"],
    "url": "https://ai-healthcare-system-eta.vercel.app/",
    "description": "CuraAssist CareHub is an AI-powered smart healthcare web application integrating live Google Gemini AI medical assistance, prescription OCR parsing, medicine scanning, and appointment scheduling.",
    "publisher": {
      "@type": "Organization",
      "name": "CuraAssist CareHub",
      "url": "https://ai-healthcare-system-eta.vercel.app/"
    },
    "medicalSpecialty": [
      "GeneralPractice",
      "Pharmacy",
      "Telemedicine"
    ]
  }
  </script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4',
              400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e',
              800: '#115e59', 900: '#134e4a', 950: '#042f2e',
            },
            cyan: { 500: '#06b6d4', 600: '#0891b2' }
          }
        }
      }
    }
  </script>

  <!-- Supabase browser client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-client.js"></script>

  <!-- Lucide Icons (Fast jsDelivr CDN + Onload Renderer) -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js" onload="if(typeof lucide !== 'undefined') lucide.createIcons()"></script>

  <!-- Leaflet CSS & JS for Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js for Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Canvas Confetti for Reminders completion -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Tesseract.js for Real OCR Prescription Text Recognition -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-teal-500 selection:text-white">

  <!-- TOP APP NAVBAR -->
  <header id="app-header" class="sticky top-0 z-40 glass-panel border-b border-slate-800/80 px-4 lg:px-6 py-3 flex items-center justify-between shadow-2xl transition-all duration-300">
    
    <!-- Logo & Brand -->
    <div class="flex items-center gap-3">
      <button id="mobile-menu-btn" style="display: none !important;" class="hidden text-slate-300 hover:text-white p-1 rounded-lg">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>
      <div class="flex items-center gap-2 cursor-pointer" onclick="switchTab('home')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-teal-500/30">
          <i data-lucide="heart-pulse" class="w-6 h-6 text-slate-950 stroke-[2.5]"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-100 to-teal-300 bg-clip-text text-transparent" id="txt-appTitle">
            CuraAssist CareHub
          </h1>
          <p class="text-[10px] text-teal-400 font-medium tracking-wide uppercase hidden sm:block" id="txt-appSubtitle">
            AI-Powered Smart Healthcare
          </p>
        </div>
      </div>
    </div>

    <!-- Header Actions (Auth, Family Switcher, Quick Scan, Language, Emergency, Notifications) -->
    <div class="flex items-center gap-2 sm:gap-3">
      
      <!-- Module 1: User Auth Button -->
      <button onclick="openAuthModal()" class="flex items-center gap-1.5 bg-slate-900 border border-slate-700 hover:border-teal-500 px-3 py-1.5 rounded-full text-xs font-semibold text-slate-200">
        <i data-lucide="log-in" class="w-3.5 h-3.5 text-teal-400"></i>
        <span id="auth-btn-text" class="hidden sm:inline">Login / Register</span>
      </button>

      <!-- Family Member Context Selector -->
      <div class="relative">
        <button id="family-selector-btn" class="flex items-center gap-2 bg-slate-900/90 border border-slate-700/70 hover:border-teal-500/50 px-3 py-1.5 rounded-full text-xs font-medium transition-all">
          <img id="active-family-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250" class="w-6 h-6 rounded-full object-cover border border-teal-400">
          <span id="active-family-name" class="hidden md:inline font-semibold">Guest User</span>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400"></i>
        </button>
        <div id="family-dropdown" class="hidden absolute right-0 mt-2 w-56 glass-panel rounded-2xl p-2 shadow-2xl z-50 border border-slate-700/80">
          <p class="text-[11px] font-semibold text-slate-400 px-3 py-1.5 uppercase tracking-wider" id="txt-familySwitch">Switch Patient Context</p>
          <div id="family-members-list" class="space-y-1">
            <!-- Dynamic family options -->
          </div>
        </div>
      </div>

      <!-- Quick Item Scan Scanner Trigger -->
      <button onclick="openItemScanModal()" class="hidden sm:flex items-center gap-1.5 bg-slate-800/80 hover:bg-teal-900/40 text-teal-300 border border-teal-500/30 px-3 py-1.5 rounded-full text-xs font-medium transition-all shadow-sm">
        <i data-lucide="scan-line" class="w-4 h-4 text-teal-400"></i>
        <span class="hidden md:inline" id="txt-scanItem">Scan Item</span>
      </button>

      <!-- Language Selector -->
      <select id="lang-selector" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-full px-2.5 py-1.5 focus:border-teal-500 focus:outline-none cursor-pointer">
        <option value="en">🇺🇸 EN</option>
        <option value="es">🇪🇸 ES</option>
        <option value="hi">🇮🇳 HI</option>
        <option value="fr">🇫🇷 FR</option>
        <option value="de">🇩🇪 DE</option>
      </select>

      <!-- Theme Switcher -->
      <button onclick="toggleTheme()" class="p-2 text-slate-300 hover:text-white rounded-full hover:bg-slate-800/80 transition-colors">
        <i data-lucide="sun" id="theme-icon" class="w-4 h-4 text-amber-400"></i>
      </button>

      <!-- Notifications Bell -->
      <div class="relative">
        <button id="notif-btn" onclick="toggleNotifDrawer()" class="p-2 text-slate-300 hover:text-white rounded-full hover:bg-slate-800/80 transition-colors relative">
          <i data-lucide="bell" class="w-5 h-5"></i>
          <span id="notif-badge" class="absolute top-1 right-1 w-2.5 h-2.5 bg-teal-500 rounded-full ring-2 ring-slate-950 animate-pulse"></span>
        </button>
      </div>

      <!-- PROMINENT EMERGENCY BUTTON -->
      <button onclick="triggerEmergencySOS()" class="sos-btn-pulse bg-gradient-to-r from-red-600 via-rose-600 to-red-700 hover:from-red-500 hover:to-rose-500 text-white font-extrabold px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm tracking-wider uppercase flex items-center gap-1.5 shadow-lg shadow-red-600/50">
        <i data-lucide="alert-triangle" class="w-4 h-4 fill-white text-red-600 animate-bounce"></i>
        <span id="txt-sosButton">Emergency</span>
      </button>

    </div>
  </header>

  <!-- MAIN WRAPPER (SIDEBAR + CONTENT) -->
  <div class="flex-1 flex overflow-hidden">

    <!-- DESKTOP NAVIGATION SIDEBAR (REMOVED IN PORTRAIT VIEW FOR MOBILE BOTTOM NAV) -->
    <aside id="app-sidebar" class="hidden lg:flex w-64 glass-panel border-r border-slate-800/80 p-4 flex-col justify-between overflow-y-auto shrink-0">
      
      <div class="space-y-6">
        <!-- Patient Status Widget -->
        <div class="p-3.5 rounded-2xl bg-gradient-to-br from-slate-900/90 to-teal-950/40 border border-teal-500/20 shadow-inner">
          <div class="flex items-center gap-3">
            <div class="relative">
              <img id="sidebar-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250" class="w-11 h-11 rounded-full object-cover ring-2 ring-teal-500/40">
              <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 rounded-full border-2 border-slate-900"></span>
            </div>
            <div>
              <h3 id="sidebar-user-name" class="font-bold text-sm text-slate-100">Guest User</h3>
              <div class="flex items-center gap-2 text-[11px] text-teal-400 font-medium">
                <span id="sidebar-user-age">34 Yrs</span> • <span id="sidebar-user-blood" class="bg-teal-500/20 text-teal-300 px-1.5 py-0.5 rounded font-bold">O+</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Navigation Links -->
        <nav class="space-y-1">
          <button onclick="switchTab('home')" class="nav-link w-full flex items-center gap-3 px-4 py-2.5 rounded-xl font-semibold text-xs text-slate-300 hover:text-white hover:bg-slate-800/50 active" id="nav-home">
            <i data-lucide="home" class="w-4 h-4 text-teal-400"></i>
            <span id="txt-home">Home</span>
          </button>
          
          <button onclick="switchTab('store')" class="nav-link w-full flex items-center gap-3 px-4 py-2.5 rounded-xl font-semibold text-xs text-slate-300 hover:text-white hover:bg-slate-800/50" id="nav-store">
            <i data-lucide="shopping-bag" class="w-4 h-4 text-cyan-400"></i>
            <span id="txt-store">Store</span>
            <span id="cart-badge-side" class="ml-auto bg-teal-500/20 text-teal-300 text-[10px] px-2 py-0.5 rounded-full font-bold">0</span>
          </button>

          <button onclick="switchTab('maps')" class="nav-link w-full flex items-center gap-3 px-4 py-2.5 rounded-xl font-semibold text-xs text-slate-300 hover:text-white hover:bg-slate-800/50" id="nav-maps">
            <i data-lucide="map-pin" class="w-4 h-4 text-indigo-400"></i>
            <span id="txt-maps">Maps</span>
          </button>

          <button onclick="switchTab('profile')" class="nav-link w-full flex items-center gap-3 px-4 py-2.5 rounded-xl font-semibold text-xs text-slate-300 hover:text-white hover:bg-slate-800/50" id="nav-profile">
            <i data-lucide="user" class="w-4 h-4 text-rose-400"></i>
            <span id="txt-profile">Profile</span>
          </button>
        </nav>

        <!-- Quick AI Assistant Action Card -->
        <div class="p-3.5 rounded-2xl glass-card border border-cyan-500/20 bg-gradient-to-br from-cyan-950/30 to-slate-900/60">
          <div class="flex items-center gap-2 mb-2">
            <div class="p-1.5 rounded-lg bg-cyan-500/20 text-cyan-300">
              <i data-lucide="bot" class="w-4 h-4"></i>
            </div>
            <span class="text-xs font-bold text-slate-200">CuraBot Assistant</span>
